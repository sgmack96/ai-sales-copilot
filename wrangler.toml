name = "ai-sales-copilot"
main = "src/index.ts"
compatibility_date = "2024-05-12"

[vars]
ENVIRONMENT = "development"

# KV Namespace for conversation memory
[[kv_namespaces]]
binding = "SESSION_KV"
id = "your-kv-namespace-id"

# D1 Database for audit logs
[[d1_databases]]
binding = "AUDIT_DB"
database_name = "ai-sales-copilot-audit"
database_id = "your-d1-database-id"

# Vectorize for RAG on Cloudflare docs
[[vectorize]]
binding = "VECTORIZE"
index_name = "cloudflare-docs"

# AI Gateway for routing between providers
[ai]
binding = "AI"

# Secrets (set via `wrangler secret put`):
# - NEWS_API_KEY
# - CRUNCHBASE_API_KEY
# - OPENAI_API_KEY (fallback)
